# Storage state authentication — uses pre-built auth-state.json
# The token was obtained by calling the backend API directly.
# Run:  discovery run --config examples/with-auth.yml

target: https://vc-awg-demo-final-code.vercel.app/transactions

auth:
  mode: storage_state
  storage_state_path: ./auth-state.json

crawl:
  max_pages: 30
  max_depth: 4
  strategy: bfs

scope:
  exclude:
    - /login
    - /register
    - /forgot-password
    - /logout

output:
  dir: ./output

