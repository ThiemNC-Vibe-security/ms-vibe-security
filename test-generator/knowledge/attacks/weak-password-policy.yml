id: weak_password_policy
name: Weak Password Policy on Registration
owasp:
  - A07:2025
  - A07:2021
cwe:
  - CWE-521
  - CWE-258
asvs:
  - V2.1.1
  - V2.1.2
  - V2.1.7
applies_to:
  - registration_form
  - password_change_form
  - password_field
payloads:
  - "a"
  - "1"
  - "password"
  - "12345"
  - "qwerty"
  - "abc"
detection:
  - registration_succeeds_with_short_password
  - registration_succeeds_with_known_breached_password
  - no_client_or_server_side_password_strength_feedback
test_template_hints:
  - fill_remaining_form_fields_with_unique_dummy_values
  - try_each_weak_payload_as_password_in_separate_attempts
  - submit_form_and_capture_outcome
  - assert_at_least_one_validation_error_is_shown
  - assert_no_successful_account_creation_with_password_length_below_8
description: |
  Asserts the registration / password-change flow rejects obviously weak
  passwords (length <8, dictionary words, all-numeric). Aligned with NIST
  800-63B and ASVS V2.
