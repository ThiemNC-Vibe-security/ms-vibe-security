id: sql_injection
name: SQL Injection
owasp:
  - A03:2021
applies_to:
  - login_form
  - registration_form
  - search_box
  - form_without_csrf
  - csrf_protected_form
  - url_param
payloads:
  - "' OR '1'='1"
  - "' OR '1'='1' --"
  - "admin'--"
  - "1' AND SLEEP(5)--"
  - "1; SELECT pg_sleep(5)--"
  - "1 UNION SELECT NULL--"
  - "%27%20OR%201=1--"
detection:
  - response_contains_sql_error
  - response_contains_keywords:["syntax","mysql","postgres","sqlite","ORA-","ODBC","SQLSTATE"]
  - response_time_above_threshold:5000
  - http_500_response
test_template_hints:
  - inject_each_payload_into_target_input_separately
  - submit_form_and_wait_for_response
  - assert_response_status_is_not_500
  - assert_response_does_not_leak_sql_error
  - assert_response_time_under_3s
  - do_not_chain_payloads_in_one_test
description: |
  Tests for classic and time-based SQL injection on text inputs that may be
  used in backend SQL queries (login fields, search boxes, URL parameters).
