id: default_credentials
name: Default or Demo Credentials Accepted
owasp:
  - A02:2025
  - A05:2021
  - A07:2021
cwe:
  - CWE-1392
  - CWE-798
  - CWE-521
asvs:
  - V2.1.9
  - V14.1.4
applies_to:
  - login_form
  - admin_login_form
payloads:
  - "admin:admin"
  - "admin:password"
  - "admin:123456"
  - "root:root"
  - "test:test"
  - "demo:demo"
  - "guest:guest"
detection:
  - login_succeeds_with_well_known_default_pair
  - admin_dashboard_reachable_after_default_login
test_template_hints:
  - split_each_payload_on_colon_into_user_and_pass
  - submit_login_form_for_each_pair
  - assert_login_did_not_succeed
  - assert_no_redirect_to_admin_or_dashboard_route
description: |
  Tests whether the application still accepts vendor or demo credentials.
  Particularly important for admin login forms and stack templates that
  ship with default accounts.
